<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="toast-container" id="toastContainer"></div>
    <h2>Получите бесплатное блюдо</h2>
    <div class="container">
      <div class="text">
        <p>Введите номер телефона</p>
        <p>На этот номер доступен один розыгрыш</p>
        <form id="phoneForm">
          <input
            type="tel"
            id="phoneInput"
            placeholder="+7 (999) 999-99-99"
            maxlength="18"
            class="form-input"
          />
          <input type="submit" value="Отправить" id="submitPhone" />
        </form>
        <a href="#">Правила акции</a>
        <a href="#">Согласие на&nbsp;обработку персональных данных</a>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
 
</html>
